<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Other Occasions — YNC Association</title>
<link rel="icon" href="../assets/ync-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="festivals">

<header class="site-header"><div id="site-header"></div></header>

<main>
  <section class="hero" style="padding:40px 0 26px;">
    <div class="container">
      <p class="text-muted" style="margin-bottom:6px;"><a href="index.html">Festival Committees</a> / Other Occasions</p>
      <span class="eyebrow">🎉 Community Celebrations</span>
      <h1>Other Occasions</h1>
      <p class="lead">Sankranti, Independence Day, New Year and other colony get-togethers — browse each occasion's photo gallery below.</p>
    </div>
  </section>

  <section class="section tight">
    <div class="container">
      <div class="pill-tabs" id="occasionTabs"></div>
      <div id="occasionDetail">
        <div class="card skeleton" style="height:200px;"></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer"><div id="site-footer"></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.YNC_ROOT = "../";</script>
<script src="../js/supabase-client.js"></script>
<script src="../js/nav.js"></script>
<script>
let occasions = [];

async function selectOccasion(occ) {
  document.querySelectorAll("#occasionTabs .pill-tab").forEach(b => b.classList.toggle("active", b.dataset.id === occ.id));
  const detail = document.getElementById("occasionDetail");
  detail.innerHTML = `
    <div class="card" style="margin-bottom:18px;">
      <h3 style="margin-bottom:4px;">${yncEscapeHtml(occ.name)} <span class="text-muted" style="font-weight:500;">· ${occ.year}</span></h3>
      <p class="text-muted">${yncEscapeHtml(occ.description || "")}</p>
    </div>
    <div class="gallery-grid" id="occasionGallery">
      <div class="skeleton" style="height:150px;"></div>
      <div class="skeleton" style="height:150px;"></div>
    </div>
  `;
  const { data: photos } = await supabaseClient
    .from("photos").select("*").eq("occasion_id", occ.id)
    .order("created_at", { ascending: false });

  const gallery = document.getElementById("occasionGallery");
  if (!photos || photos.length === 0) {
    gallery.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="icon">📷</div>No photos uploaded yet for this occasion.</div>`;
    return;
  }
  gallery.innerHTML = photos.map(p => `
    <div>
      <img src="${yncEscapeHtml(p.thumbnail_url || p.image_url)}" alt="${yncEscapeHtml(p.caption || '')}" loading="lazy">
      ${p.caption ? `<div class="gallery-caption">${yncEscapeHtml(p.caption)}</div>` : ""}
    </div>
  `).join("");
}

async function init() {
  const { data: committee } = await supabaseClient.from("festival_committees").select("id").eq("slug", "other").maybeSingle();
  if (!committee) return;

  const { data } = await supabaseClient
    .from("occasions").select("*").eq("committee_id", committee.id)
    .order("year", { ascending: false }).order("display_order", { ascending: true });

  occasions = data || [];
  const tabs = document.getElementById("occasionTabs");
  if (occasions.length === 0) {
    tabs.style.display = "none";
    document.getElementById("occasionDetail").innerHTML = `<div class="empty-state"><div class="icon">🎉</div>No occasions added yet.</div>`;
    return;
  }
  tabs.innerHTML = occasions.map(o => `<button class="pill-tab" data-id="${o.id}">${yncEscapeHtml(o.name)} (${o.year})</button>`).join("");
  tabs.querySelectorAll(".pill-tab").forEach(btn => {
    btn.addEventListener("click", () => selectOccasion(occasions.find(o => o.id === btn.dataset.id)));
  });
  selectOccasion(occasions[0]);
}
init();
</script>
</body>
</html>
