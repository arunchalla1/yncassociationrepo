<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — YNC Association</title>
<link rel="icon" href="assets/ync-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reset-password">

<header class="site-header"><div id="site-header"></div></header>

<main>
  <section class="section">
    <div class="container" style="max-width:440px;">
      <div class="card">
        <div class="text-center" style="margin-bottom:20px;">
          <img src="assets/ync-logo.png" alt="YNC logo" style="width:56px;height:56px;margin:0 auto 10px;">
          <h2 style="margin-bottom:2px;">Set a new password</h2>
          <p class="text-muted" style="font-size:0.9rem;" id="resetSubtitle">Checking your reset link…</p>
        </div>

        <div id="resetAlert" class="alert alert-error" hidden></div>
        <div id="resetSuccess" class="alert alert-success" hidden></div>

        <form id="resetForm" hidden>
          <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="6" required autocomplete="new-password">
            <div class="field-hint">At least 6 characters.</div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" minlength="6" required autocomplete="new-password">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="resetBtn">Set new password</button>
        </form>

        <p class="text-center text-muted" id="resetBackLink" style="margin-top:16px; font-size:0.88rem;" hidden>
          <a href="login.html">Back to sign in</a>
        </p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer"><div id="site-footer"></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.YNC_ROOT = "";</script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script>
// Supabase's password-reset email links here with a recovery token in the URL;
// supabase-js (detectSessionInUrl, on by default) picks it up automatically and
// fires a PASSWORD_RECOVERY auth event once it's parsed the link.
const subtitle = document.getElementById("resetSubtitle");
const form = document.getElementById("resetForm");
const backLink = document.getElementById("resetBackLink");
let recoveryReady = false;

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    recoveryReady = true;
    subtitle.textContent = "Choose a new password for your account.";
    form.hidden = false;
  }
});

// If the link already expired, was already used, or this page was opened directly
// (not via a reset email), there's no recovery session — say so plainly.
setTimeout(() => {
  if (!recoveryReady) {
    subtitle.textContent = "This reset link is invalid or has expired.";
    document.getElementById("resetAlert").textContent = "Request a new reset link from the sign-in page.";
    document.getElementById("resetAlert").hidden = false;
    backLink.hidden = false;
  }
}, 2500);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("resetAlert");
  const successBox = document.getElementById("resetSuccess");
  const btn = document.getElementById("resetBtn");
  alertBox.hidden = true; successBox.hidden = true;

  const pw = document.getElementById("newPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  if (pw !== confirm) {
    alertBox.textContent = "Passwords don't match.";
    alertBox.hidden = false;
    return;
  }

  btn.disabled = true; btn.textContent = "Saving…";
  const { error } = await supabaseClient.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = "Set new password";

  if (error) {
    alertBox.textContent = error.message || "Could not update password.";
    alertBox.hidden = false;
    return;
  }

  form.hidden = true;
  successBox.textContent = "Password updated. You can sign in with it now.";
  successBox.hidden = false;
  backLink.hidden = false;
});
</script>
</body>
</html>
