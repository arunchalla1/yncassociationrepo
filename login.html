<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — YNC Association</title>
<link rel="icon" href="assets/ync-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

<header class="site-header"><div id="site-header"></div></header>

<main>
  <section class="section">
    <div class="container" style="max-width:440px;">
      <div class="card">
        <div class="text-center" style="margin-bottom:20px;">
          <img src="assets/ync-logo.png" alt="YNC logo" style="width:56px;height:56px;margin:0 auto 10px;">
          <h2 style="margin-bottom:2px;">Staff sign in</h2>
          <p class="text-muted" style="font-size:0.9rem;">For Association &amp; Festival Committee members.</p>
        </div>

        <div id="loginAlert" class="alert alert-error" hidden></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Sign in</button>
        </form>

        <p class="text-center" style="margin-top:14px; font-size:0.88rem;">
          <a href="#" id="forgotPasswordLink">Forgot your password?</a>
        </p>
        <div id="forgotAlert" class="alert alert-error" hidden style="margin-top:8px;"></div>
        <div id="forgotSuccess" class="alert alert-success" hidden style="margin-top:8px;"></div>

        <p class="text-center text-muted" style="margin-top:16px; font-size:0.88rem;">
          New staff member? <a href="signup.html">Create an account</a>
        </p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer"><div id="site-footer"></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.YNC_ROOT = "";</script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById("loginAlert");
  const btn = document.getElementById("loginBtn");
  alertBox.hidden = true;
  btn.disabled = true; btn.textContent = "Signing in…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  btn.disabled = false; btn.textContent = "Sign in";
  if (error) {
    alertBox.textContent = error.message || "Could not sign in. Check your email and password.";
    alertBox.hidden = false;
    return;
  }

  const { data: profile } = await supabaseClient.from("profiles").select("role").eq("id", data.user.id).maybeSingle();
  if (profile && profile.role === "admin") {
    window.location.href = "admin/dashboard.html";
  } else {
    window.location.href = "index.html";
  }
});

// Self-service password reset — sends a reset link by email, so an admin's password
// no longer needs to be shared or looked up by anyone else. Requires a real, reachable
// email address on the account (the sample "…@yncassociation.demo" account can't
// receive mail, so this won't work for it — see README).
document.getElementById("forgotPasswordLink").addEventListener("click", async (e) => {
  e.preventDefault();
  const forgotAlert = document.getElementById("forgotAlert");
  const forgotSuccess = document.getElementById("forgotSuccess");
  forgotAlert.hidden = true; forgotSuccess.hidden = true;

  const email = document.getElementById("email").value.trim();
  if (!email) {
    forgotAlert.textContent = "Enter your email address above first, then click \"Forgot your password?\".";
    forgotAlert.hidden = false;
    return;
  }

  const link = document.getElementById("forgotPasswordLink");
  link.textContent = "Sending reset link…";
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname.replace(/login\.html$/, "") + "reset-password.html",
  });
  link.textContent = "Forgot your password?";

  if (error) {
    forgotAlert.textContent = error.message || "Could not send reset email.";
    forgotAlert.hidden = false;
    return;
  }
  forgotSuccess.textContent = "If an account exists for that email, a password reset link was just sent to it. Check your inbox (and spam folder).";
  forgotSuccess.hidden = false;
});
</script>
</body>
</html>
